name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aurel
          POSTGRES_PASSWORD: aurel-ci-only
          POSTGRES_DB: aurel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurel" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - name: Migrations on PostgreSQL
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://aurel:aurel-ci-only@localhost:5432/aurel
        run: .venv/bin/python -m alembic upgrade head
      - name: pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://aurel:aurel-ci-only@localhost:5432/aurel' || '' }}
        run: |
          [ -z "$TEST_DATABASE_URL" ] && unset TEST_DATABASE_URL
          .venv/bin/python -m pytest -q

  shared:
    name: Shared package tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  web:
    name: Web lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  mobile:
    name: Mobile lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit

  e2e:
    name: Web end-to-end + accessibility
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - working-directory: services/api
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: apps/web
        env:
          PW_CHANNEL: ""  # bundled Chromium instead of the local Microsoft Edge
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
